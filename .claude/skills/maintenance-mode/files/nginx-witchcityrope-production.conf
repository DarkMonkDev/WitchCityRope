# WitchCityRope Production - Nginx Configuration
# Domains: prod.notfai.com, prod.witchcityrope.com
#
# MAINTENANCE MODE:
#   Enable:  touch /opt/witchcityrope/production/maintenance.flag && sudo systemctl reload nginx
#   Disable: rm /opt/witchcityrope/production/maintenance.flag && sudo systemctl reload nginx
#
# BACKDOOR: notfai.com / www.notfai.com is served by a separate nginx config
#           (notfai-production) and is EXEMPT from maintenance mode. Use it to
#           access the real site while maintenance is active.

server {
    if ($host = prod.witchcityrope.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = prod.notfai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name prod.notfai.com prod.witchcityrope.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name prod.notfai.com prod.witchcityrope.com;

    access_log /var/log/nginx/witchcityrope-production-access.log;

    # Request size limit
    client_max_body_size 10M;

    # Rate limiting status code
    limit_req_status 429;

    # Security headers - production grade
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Content Security Policy - production
    # unsafe-inline for style-src required by Mantine CSS-in-JS
    # Google Fonts domains required by the maintenance page
    # Production Authorize.net domain only (no test domain)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.authorize.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self';" always;

    # ============================================
    # MAINTENANCE MODE CONFIGURATION
    # ============================================

    # Custom error pages for maintenance and rate limiting
    error_page 503 @maintenance;
    error_page 502 504 @fallback;
    error_page 429 /429.html;

    # Maintenance page served when flag file exists (manual toggle or planned deploy)
    location @maintenance {
        root /opt/witchcityrope/maintenance;
        rewrite ^(.*)$ /maintenance.html break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "60" always;
    }

    # Fallback page served when containers are down (502/504 from upstream)
    location @fallback {
        root /opt/witchcityrope/maintenance;
        try_files /maintenance.html =503;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "60" always;
    }

    # Rate limit error page
    location = /429.html {
        root /opt/witchcityrope/maintenance;
        internal;
    }

    # Serve maintenance page static assets (CSS, images) regardless of maintenance state
    # ^~ prefix ensures this takes priority over the regex static asset caching block
    location ^~ /maintenance-assets/ {
        alias /opt/witchcityrope/maintenance/;
        expires 1h;
    }

    # ============================================
    # APPLICATION ROUTES
    # ============================================

    # Hangfire Dashboard - proxy to API container (admin auth handled by app)
    location /hangfire {
        # Maintenance mode check
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints - strict rate limiting (5 req/min per IP)
    location /api/auth/ {
        # Maintenance mode check
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        limit_req zone=wcr_auth burst=5 nodelay;
        proxy_pass http://localhost:5001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy - moderate rate limiting (30 req/sec per IP)
    location /api/ {
        # Maintenance mode check
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        limit_req zone=wcr_api burst=20 nodelay;
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check (no caching) - exempt from maintenance so deploy scripts can poll it
    location /health {
        proxy_pass http://localhost:5001/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # API health endpoint - also exempt from maintenance for deploy verification
    location = /api/health {
        proxy_pass http://localhost:5001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React application (everything else)
    location / {
        # Maintenance mode check
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|woff|woff2|ttf|svg)$ {
        proxy_pass http://localhost:3001;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    ssl_certificate /etc/letsencrypt/live/prod.notfai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/prod.notfai.com/privkey.pem; # managed by Certbot
}
