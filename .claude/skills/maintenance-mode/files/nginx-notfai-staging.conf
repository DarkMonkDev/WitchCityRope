# WitchCityRope Staging - Nginx Configuration
# Domains: staging.notfai.com, staging.witchcityrope.com
#
# MAINTENANCE MODE:
#   Enable:  touch /opt/witchcityrope/staging/maintenance.flag && sudo systemctl reload nginx
#   Disable: rm /opt/witchcityrope/staging/maintenance.flag && sudo systemctl reload nginx
#
# No backdoor URL for staging - both domains show maintenance page when enabled.

server {
    if ($host = staging.notfai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = staging.witchcityrope.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name staging.notfai.com staging.witchcityrope.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.notfai.com staging.witchcityrope.com;
    ssl_certificate /etc/letsencrypt/live/staging.witchcityrope.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/staging.witchcityrope.com/privkey.pem; # managed by Certbot

    # Request size limit
    client_max_body_size 10M;

    # Rate limiting status code
    limit_req_status 429;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Content Security Policy
    # unsafe-inline for style-src required by Mantine CSS-in-JS
    # Authorize.net Accept.js domains for payment processing
    # Google Fonts domains required by the maintenance page
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://jstest.authorize.net https://js.authorize.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self';" always;

    # ============================================
    # MAINTENANCE MODE CONFIGURATION
    # ============================================

    # Custom error pages for maintenance and rate limiting
    error_page 503 @maintenance;
    error_page 502 504 @fallback;
    error_page 429 /429.html;

    # Maintenance page served when flag file exists (manual toggle or planned deploy)
    location @maintenance {
        root /opt/witchcityrope/maintenance;
        rewrite ^(.*)$ /maintenance.html break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "60" always;
    }

    # Fallback page served when containers are down (502/504 from upstream)
    location @fallback {
        root /opt/witchcityrope/maintenance;
        try_files /maintenance.html =503;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "60" always;
    }

    # Rate limit error page
    location = /429.html {
        root /opt/witchcityrope/maintenance;
        internal;
    }

    # Serve maintenance page static assets (CSS, images) regardless of maintenance state
    # ^~ prefix ensures this takes priority over any regex static asset caching blocks
    location ^~ /maintenance-assets/ {
        alias /opt/witchcityrope/maintenance/;
        expires 1h;
    }

    # ============================================
    # APPLICATION ROUTES
    # ============================================

    # Health check - exempt from maintenance so deploy scripts can poll it
    location /health {
        proxy_pass http://localhost:5002/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # API health endpoint - also exempt from maintenance for deploy verification
    location = /api/health {
        proxy_pass http://localhost:5002/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staging React app (port 3002)
    location / {
        # Maintenance mode check: if flag file exists, return 503
        if (-f /opt/witchcityrope/staging/maintenance.flag) {
            return 503;
        }

        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Hangfire Dashboard - proxy to API container (admin auth handled by app)
    location /hangfire {
        # Maintenance mode check
        if (-f /opt/witchcityrope/staging/maintenance.flag) {
            return 503;
        }

        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints - strict rate limiting (5 req/min per IP)
    location /api/auth/ {
        # Maintenance mode check
        if (-f /opt/witchcityrope/staging/maintenance.flag) {
            return 503;
        }

        limit_req zone=wcr_auth burst=5 nodelay;
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staging API (port 5002) - moderate rate limiting (30 req/sec per IP)
    location /api/ {
        # Maintenance mode check
        if (-f /opt/witchcityrope/staging/maintenance.flag) {
            return 503;
        }

        limit_req zone=wcr_api burst=20 nodelay;
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
