# notfai.com Production - Nginx Configuration (BACKDOOR)
# Domains: notfai.com, www.notfai.com
#
# PURPOSE: This config is the BACKDOOR URL for WitchCityRope production.
#          It proxies to the same production containers as witchcityrope-production
#          but is NEVER subject to maintenance mode. Use this URL to access the
#          real site while maintenance is enabled on prod.notfai.com / prod.witchcityrope.com.
#
# MAINTENANCE MODE: This config has NO maintenance flag checks. It always proxies
#                   to the app. The only time it won't work is if containers are actually down
#                   (502/504), in which case it shows the maintenance page as a fallback.

server {
    listen 80;
    listen [::]:80;
    server_name notfai.com www.notfai.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notfai.com www.notfai.com;

    ssl_certificate /etc/letsencrypt/live/notfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notfai.com/privkey.pem;

    # Request size limit
    client_max_body_size 10M;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Content Security Policy
    # Google Fonts domains required by the maintenance fallback page
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.authorize.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self';" always;

    # ============================================
    # FALLBACK ONLY (no maintenance flag check)
    # Only triggers when containers are actually down
    # ============================================

    error_page 502 504 @fallback;

    location @fallback {
        root /opt/witchcityrope/maintenance;
        try_files /maintenance.html =502;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "60" always;
    }

    # Serve maintenance page static assets (needed for fallback page CSS/fonts)
    # ^~ prefix ensures this takes priority over any regex static asset caching blocks
    location ^~ /maintenance-assets/ {
        alias /opt/witchcityrope/maintenance/;
        expires 1h;
    }

    # ============================================
    # APPLICATION ROUTES (NO maintenance checks)
    # ============================================

    # Production React app (port 3001)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Production API (port 5001)
    location /api/ {
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:5001/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
