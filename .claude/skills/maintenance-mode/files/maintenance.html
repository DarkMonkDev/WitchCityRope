<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Auto-refresh every 30 seconds; when the site is back, this reload lands on the real page -->
    <meta http-equiv="refresh" content="30">
    <title>Witch City Rope - We'll Be Right Back</title>
    <link rel="stylesheet" href="/maintenance-assets/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Satisfy&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header band with burgundy-to-plum gradient (matches login page) -->
        <div class="header-band">
            <h1>Witch City Rope</h1>
            <p class="tagline">Where curiosity meets connection</p>
        </div>

        <!-- Card body -->
        <div class="card-body">
            <h2>We're updating our community space</h2>
            <p class="message">
                We're making improvements to bring you a better experience.
                Everything will be back to normal shortly.
            </p>

            <div class="spinner"></div>

            <p class="eta">
                This page refreshes automatically every 30 seconds.
            </p>
        </div>

        <!-- Footer -->
        <div class="card-footer">
            <p class="contact">
                Questions? Reach us at
                <a href="mailto:info@witchcityrope.com">info@witchcityrope.com</a>
            </p>
        </div>
    </div>
</body>
</html>
