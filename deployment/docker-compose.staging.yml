# WitchCityRope Staging Docker Compose
# DigitalOcean Deployment Configuration
# Uses: Managed PostgreSQL, System Nginx, Container Registry
# Domain: staging.notfai.com

version: '3.8'

networks:
  witchcity-staging:
    driver: bridge

volumes:
  api_uploads_staging:
    driver: local
  redis_data_staging:
    driver: local

services:
  # ==========================================================================
  # API Service - .NET 10 Minimal API (Staging)
  # ==========================================================================
  api:
    env_file:
      - .env
    image: registry.digitalocean.com/witchcityrope/staging-api-witchcityrope:${IMAGE_TAG:-latest}
    container_name: witchcity-api-staging
    restart: unless-stopped
    networks:
      - witchcity-staging
    ports:
      - "127.0.0.1:5002:8080"  # Localhost only — host nginx reverse-proxies to this port (PCI compliance: prevent direct public access)
    volumes:
      - api_uploads_staging:/app/uploads
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Staging
      - ConnectionStrings__DefaultConnection=${STAGING_DB_CONNECTION_STRING}
      # JWT config must match Jwt:* paths read by Program.cs and JwtService.cs
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=https://staging.notfai.com
      - Jwt__Audience=https://staging.notfai.com
      - Jwt__ExpirationMinutes=15
      - CORS__AllowedOrigins=https://staging.notfai.com
      - CORS__AllowCredentials=true
      - Serilog__MinimumLevel__Default=Debug
      - Serilog__MinimumLevel__Override__Microsoft=Information
      # PayPal Configuration - reads from .env
      - PayPal__ClientId=${PAYPAL_CLIENT_ID}
      - PayPal__Secret=${PAYPAL_SECRET}
      - PayPal__Mode=${PAYPAL_MODE:-sandbox}
      - PayPal__WebhookId=${PAYPAL_WEBHOOK_ID:-}
      # Authorize.net Configuration - reads from .env
      - CreditCardProcessor__ActiveProcessor=AuthorizeNet
      - CreditCardProcessor__AuthorizeNet__ApiLoginId=${AUTHORIZENET_API_LOGIN_ID}
      - CreditCardProcessor__AuthorizeNet__TransactionKey=${AUTHORIZENET_TRANSACTION_KEY}
      - CreditCardProcessor__AuthorizeNet__ClientKey=${AUTHORIZENET_CLIENT_KEY:-}
      - CreditCardProcessor__AuthorizeNet__TestMode=${AUTHORIZENET_TEST_MODE:-true}
      # Email Configuration (SendGrid) - reads from .env
      - Vetting__EmailEnabled=${Vetting__EmailEnabled:-true}
      - Vetting__SendGridApiKey=${Vetting__SendGridApiKey}
      - Vetting__SendGridSandboxMode=${Vetting__SendGridSandboxMode:-false}
      - Vetting__FromEmail=${Vetting__FromEmail:-info@witchcityrope.com}
      - Vetting__FromName=${Vetting__FromName:-WitchCityRope}
      # Frontend URL for email verification links
      - Frontend__Url=${Frontend__Url:-https://staging.notfai.com}
      # Backup Configuration - Staging Isolated Storage
      - BackupConfiguration__Database__Host=${BACKUP_DB_HOST}
      - BackupConfiguration__Database__Port=${BACKUP_DB_PORT:-25060}
      - BackupConfiguration__Database__DatabaseName=${BACKUP_DB_NAME:-witchcityrope_staging}
      - BackupConfiguration__Database__SchemaName=public
      - BackupConfiguration__Database__Username=${BACKUP_DB_USER}
      - BackupConfiguration__Database__Password=${BACKUP_DB_PASSWORD}
      # Spaces storage configuration
      - BackupConfiguration__Spaces__Endpoint=https://nyc3.digitaloceanspaces.com
      - BackupConfiguration__Spaces__BucketName=witchcityrope
      - BackupConfiguration__Spaces__AccessKey=${DIGITALOCEAN_SPACES_ACCESS_KEY}
      - BackupConfiguration__Spaces__SecretKey=${DIGITALOCEAN_SPACES_SECRET_KEY}
      - BackupConfiguration__Spaces__FolderPrefix=backups/staging
      - BackupConfiguration__BackupOptions__TempDirectory=/tmp
      - BackupConfiguration__BackupOptions__TimeoutSeconds=300
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Web Service - React + Vite (Staging Build with Nginx)
  # ==========================================================================
  web:
    image: registry.digitalocean.com/witchcityrope/staging-web-witchcityrope:${IMAGE_TAG:-latest}
    container_name: witchcity-web-staging
    restart: unless-stopped
    networks:
      - witchcity-staging
    ports:
      - "127.0.0.1:3002:80"  # Localhost only — host nginx reverse-proxies to this port (PCI compliance: prevent direct public access)
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=/api
      - VITE_APP_ENVIRONMENT=staging
      - VITE_APP_TITLE=WitchCityRope (Staging)
      - VITE_APP_VERSION=${APP_VERSION:-staging}
      - VITE_ENABLE_DEBUG=true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Redis Cache Service (Staging)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: witchcity-redis-staging
    restart: unless-stopped
    networks:
      - witchcity-staging
    volumes:
      - redis_data_staging:/data
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru"
    ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# Deployment Notes:
# ================
#
# System Nginx Configuration (already configured on server):
#   - Staging: https://staging.notfai.com → http://localhost:3002 (React)
#   - Staging API: https://staging.notfai.com/api → http://localhost:5002 (API)
#   - SSL: Let's Encrypt certificates already installed
#
# Database Configuration:
#   - Using DigitalOcean Managed PostgreSQL (not a container)
#   - Connection string provided via environment variable
#   - Two databases: witchcityrope_staging (this env)
#
# Docker Registry:
#   - Images pushed to: registry.digitalocean.com/witchcityrope/
#   - API image: registry.digitalocean.com/witchcityrope/staging-api-witchcityrope:latest
#   - Web image: registry.digitalocean.com/witchcityrope/staging-web-witchcityrope:latest
#
# Deployment Commands:
#   cd /opt/witchcityrope/staging
#   docker-compose -f docker-compose.staging.yml pull
#   docker-compose -f docker-compose.staging.yml up -d
#   docker-compose -f docker-compose.staging.yml logs -f
#
# Health Checks:
#   - Internal: docker-compose ps
#   - External: curl https://staging.notfai.com/health
#   - External API: curl https://staging.notfai.com/api/health
