# WitchCityRope Production Docker Compose
# DigitalOcean Deployment Configuration
# Uses: Managed PostgreSQL, System Nginx, Container Registry
# Domain: prod.notfai.com (testing), prod.witchcityrope.com → witchcityrope.com (production)

version: '3.8'

networks:
  witchcity-production:
    driver: bridge

volumes:
  api_uploads:
    driver: local
  redis_data:
    driver: local

services:
  # ==========================================================================
  # API Service - .NET 10 Minimal API
  # ==========================================================================
  api:
    env_file:
      - .env
    image: registry.digitalocean.com/witchcityrope/production-api-witchcityrope:${IMAGE_TAG:-latest}
    container_name: witchcity-api-prod
    restart: unless-stopped
    networks:
      - witchcity-production
    ports:
      - "127.0.0.1:5001:8080"  # Localhost only — host nginx reverse-proxies to this port (PCI compliance: prevent direct public access)
    volumes:
      - api_uploads:/app/uploads
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${PROD_DB_CONNECTION_STRING}
      # JWT config must match Jwt:* paths read by Program.cs and JwtService.cs
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=https://witchcityrope.com
      - Jwt__Audience=https://witchcityrope.com
      - Jwt__ExpirationMinutes=15
      - CORS__AllowedOrigins=https://prod.notfai.com,https://prod.witchcityrope.com,https://witchcityrope.com,https://www.witchcityrope.com
      - CORS__AllowCredentials=true
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__Microsoft=Warning
      # Authorize.Net Configuration - reads from .env
      - CreditCardProcessor__ActiveProcessor=AuthorizeNet
      - CreditCardProcessor__AuthorizeNet__ApiLoginId=${AUTHORIZENET_API_LOGIN_ID}
      - CreditCardProcessor__AuthorizeNet__TransactionKey=${AUTHORIZENET_TRANSACTION_KEY}
      - CreditCardProcessor__AuthorizeNet__ClientKey=${AUTHORIZENET_CLIENT_KEY:-}
      - CreditCardProcessor__AuthorizeNet__TestMode=false
      # PayPal Configuration - reads from .env
      - PayPal__ClientId=${PAYPAL_CLIENT_ID}
      - PayPal__Secret=${PAYPAL_SECRET}
      - PayPal__Mode=${PAYPAL_MODE:-live}
      - PayPal__WebhookId=${PAYPAL_WEBHOOK_ID}
      # Email Configuration (SendGrid) - reads from .env
      - Vetting__EmailEnabled=${Vetting__EmailEnabled:-true}
      - Vetting__SendGridApiKey=${Vetting__SendGridApiKey}
      - Vetting__SendGridSandboxMode=${Vetting__SendGridSandboxMode:-false}
      - Vetting__FromEmail=${Vetting__FromEmail:-info@witchcityrope.com}
      - Vetting__FromName=${Vetting__FromName:-WitchCityRope}
      # Frontend URL for email verification links
      - Frontend__Url=${Frontend__Url:-https://witchcityrope.com}
      # Backup Configuration - Production Isolated Storage
      # Database connection for pg_dump (must match managed PostgreSQL)
      - BackupConfiguration__Database__Host=${BACKUP_DB_HOST}
      - BackupConfiguration__Database__Port=${BACKUP_DB_PORT:-25060}
      - BackupConfiguration__Database__DatabaseName=${BACKUP_DB_NAME:-witchcityrope_production}
      - BackupConfiguration__Database__SchemaName=public
      - BackupConfiguration__Database__Username=${BACKUP_DB_USER}
      - BackupConfiguration__Database__Password=${BACKUP_DB_PASSWORD}
      # Spaces storage configuration
      - BackupConfiguration__Spaces__Endpoint=https://nyc3.digitaloceanspaces.com
      - BackupConfiguration__Spaces__BucketName=witchcityrope
      - BackupConfiguration__Spaces__AccessKey=${DIGITALOCEAN_SPACES_ACCESS_KEY}
      - BackupConfiguration__Spaces__SecretKey=${DIGITALOCEAN_SPACES_SECRET_KEY}
      - BackupConfiguration__Spaces__FolderPrefix=backups/production
      - BackupConfiguration__BackupOptions__TempDirectory=/tmp
      - BackupConfiguration__BackupOptions__TimeoutSeconds=300
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Web Service - React + Vite (Production Build with Nginx)
  # ==========================================================================
  web:
    image: registry.digitalocean.com/witchcityrope/production-web-witchcityrope:${IMAGE_TAG:-latest}
    container_name: witchcity-web-prod
    restart: unless-stopped
    networks:
      - witchcity-production
    ports:
      - "127.0.0.1:3001:80"  # Localhost only — host nginx reverse-proxies to this port (PCI compliance: prevent direct public access)
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=/api
      - VITE_APP_ENVIRONMENT=production
      - VITE_APP_TITLE=WitchCityRope
      - VITE_APP_VERSION=${APP_VERSION:-1.0.0}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Redis Cache Service
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: witchcity-redis-prod
    restart: unless-stopped
    networks:
      - witchcity-production
    volumes:
      - redis_data:/data
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru"
    ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# Deployment Notes:
# ================
#
# System Nginx Configuration (already configured on server):
#   - Production: https://notfai.com → http://localhost:3001 (React)
#   - Production API: https://notfai.com/api → http://localhost:5001 (API)
#   - SSL: Let's Encrypt certificates already installed
#
# Database Configuration:
#   - Using DigitalOcean Managed PostgreSQL (not a container)
#   - Connection string provided via environment variable
#   - Two databases: witchcityrope_production (this env)
#
# Docker Registry:
#   - Images pushed to: registry.digitalocean.com/witchcityrope/
#   - API image: registry.digitalocean.com/witchcityrope/witchcityrope-api:latest
#   - Web image: registry.digitalocean.com/witchcityrope/witchcityrope-web:latest
#
# Deployment Commands:
#   cd /opt/witchcityrope/production
#   docker-compose -f docker-compose.production.yml pull
#   docker-compose -f docker-compose.production.yml up -d
#   docker-compose -f docker-compose.production.yml logs -f
#
# Health Checks:
#   - Internal: docker-compose ps
#   - External: curl https://notfai.com/health
#   - External API: curl https://notfai.com/api/health
