# Nginx configuration for WitchCityRope Production Environment

# Upstream definitions
upstream production_web {
    server web:8080;
    keepalive 32;
}

upstream production_api {
    server api:8080;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name witchcityrope.com www.witchcityrope.com api.witchcityrope.com;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main production website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name witchcityrope.com www.witchcityrope.com;

    # SSL Configuration - production grade
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security Headers - production grade
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # payment=() removed: PayPal JS SDK requires the Payment Request API permission
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=()" always;
    # Content Security Policy - includes payment processor domains (Authorize.net + PayPal)
    # js.authorize.net = Accept.js SDK (production)
    # api.authorize.net = Accept.js API calls (production)
    # www.paypal.com / *.paypal.com = PayPal JS SDK, buttons, and API
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.authorize.net https://www.paypal.com https://*.paypal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src 'self' https://www.paypal.com https://*.paypal.com; connect-src 'self' https://api.witchcityrope.com https://api.authorize.net https://js.authorize.net https://www.paypal.com https://*.paypal.com;" always;

    # Logging
    access_log /var/log/nginx/production.access.log combined;
    error_log /var/log/nginx/production.error.log warn;

    # General settings
    client_max_body_size 10M;
    proxy_read_timeout 90;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Main application
    location / {
        proxy_pass http://production_web;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files with caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff|woff2|ttf|svg|eot)$ {
        proxy_pass http://production_web;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://production_web;
        access_log off;
    }
}

# API subdomain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.witchcityrope.com;

    # SSL Configuration (same certificate)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    # CORS headers for API subdomain
    add_header Access-Control-Allow-Origin "https://witchcityrope.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-CSRF-TOKEN" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "86400" always;

    # Logging
    access_log /var/log/nginx/api.production.access.log combined;
    error_log /var/log/nginx/api.production.error.log warn;

    # General settings
    client_max_body_size 10M;
    proxy_read_timeout 90;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Auth endpoints - strict rate limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://production_api;
    }

    # API endpoints with rate limiting
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://production_api;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://production_api;
        access_log off;
    }

    # Metrics endpoint (for monitoring)
    location /metrics {
        proxy_pass http://production_api;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }
}

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
