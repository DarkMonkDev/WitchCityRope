# WitchCityRope Production - Public Domain Configuration
# Domains: witchcityrope.com, www.witchcityrope.com
#
# MAINTENANCE MODE:
#   Uses the SAME flag file as the prod.notfai.com config:
#   Enable:  touch /opt/witchcityrope/production/maintenance.flag && sudo systemctl reload nginx
#   Disable: rm /opt/witchcityrope/production/maintenance.flag && sudo systemctl reload nginx
#
# BACKDOOR: notfai.com / www.notfai.com is served by a separate nginx config
#           (notfai-production) and is EXEMPT from maintenance mode.

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name witchcityrope.com www.witchcityrope.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://witchcityrope.com$request_uri;
    }
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.witchcityrope.com;

    ssl_certificate /etc/letsencrypt/live/witchcityrope.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witchcityrope.com/privkey.pem;

    return 301 https://witchcityrope.com$request_uri;
}

# Main production site
server {
    listen 443 ssl http2;
    server_name witchcityrope.com;

    ssl_certificate /etc/letsencrypt/live/witchcityrope.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witchcityrope.com/privkey.pem;

    # Request size limit
    client_max_body_size 10M;

    # Rate limiting status code
    limit_req_status 429;

    # Security headers - production grade
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Content Security Policy - production
    # unsafe-inline for style-src required by Mantine CSS-in-JS
    # Payment processor domains: Authorize.net Accept.js + PayPal JS SDK
    # Google Fonts domains required by the maintenance page
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.authorize.net https://www.paypal.com https://*.paypal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.paypal.com https://*.paypal.com; connect-src 'self' https://api.authorize.net https://api2.authorize.net https://js.authorize.net https://www.paypal.com https://*.paypal.com;" always;

    # ============================================
    # MAINTENANCE MODE CONFIGURATION
    # ============================================

    # Custom error pages for maintenance and rate limiting
    error_page 503 @maintenance;
    error_page 502 504 @fallback;
    error_page 429 /429.html;

    # Maintenance page served when flag file exists (manual toggle or planned deploy)
    location @maintenance {
        root /opt/witchcityrope/maintenance;
        rewrite ^(.*)$ /maintenance.html break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "60" always;
    }

    # Fallback page served when containers are down (502/504 from upstream)
    location @fallback {
        root /opt/witchcityrope/maintenance;
        try_files /maintenance.html =503;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "60" always;
    }

    # Rate limit error page
    location = /429.html {
        root /opt/witchcityrope/maintenance;
        internal;
    }

    # Serve maintenance page static assets (CSS, images) regardless of maintenance state
    location ^~ /maintenance-assets/ {
        alias /opt/witchcityrope/maintenance/;
        expires 1h;
    }

    # ============================================
    # APPLICATION ROUTES
    # ============================================

    # Hangfire Dashboard - proxy to API container (admin auth handled by app)
    location /hangfire {
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login/register - strict rate limiting (brute force protection, 5 req/min per IP)
    location /api/auth/login {
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        limit_req zone=wcr_auth burst=5 nodelay;
        proxy_pass http://localhost:5001/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/auth/register {
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        limit_req zone=wcr_auth burst=5 nodelay;
        proxy_pass http://localhost:5001/api/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/auth/forgot-password {
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        limit_req zone=wcr_auth burst=5 nodelay;
        proxy_pass http://localhost:5001/api/auth/forgot-password;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other auth endpoints - permissive rate limiting (30 req/min per IP)
    # Token refresh, user check, logout, email verification fire automatically
    # and frequently due to refresh token architecture
    # NOTE: Requires wcr_auth_refresh zone defined in main nginx.conf http block:
    #   limit_req_zone $binary_remote_addr zone=wcr_auth_refresh:10m rate=30r/m;
    location /api/auth/ {
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        limit_req zone=wcr_auth_refresh burst=10 nodelay;
        proxy_pass http://localhost:5001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy - moderate rate limiting (30 req/sec per IP)
    location /api/ {
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        limit_req zone=wcr_api burst=20 nodelay;
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check (no caching) - exempt from maintenance so deploy scripts can poll it
    location /health {
        proxy_pass http://localhost:5001/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # API health endpoint - also exempt from maintenance for deploy verification
    location = /api/health {
        proxy_pass http://localhost:5001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React application (everything else)
    location / {
        if (-f /opt/witchcityrope/production/maintenance.flag) {
            return 503;
        }

        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|woff|woff2|ttf|svg)$ {
        proxy_pass http://localhost:3001;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
